<!doctype html><html lang="ja"><meta charset="utf-8"><title>Internal catalogue verification</title><style>body{font:14px Arial}#mount{width:390px;height:350px}iframe{border:1px solid;width:390px;height:844px}pre{white-space:pre-wrap}</style><h1>Catalogue runtime checks</h1><button id="run" disabled>Run interactive lab checks</button><p id="status">Ready</p><div id="mount"></div><pre id="results"></pre><h2>Responsive viewport</h2><label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Page<select id="page"><option value="index.html">Home</option><option value="catalog.html">Index</option><option value="expressions/case-product.html">Product</option><option value="expressions/ui-validation.html">Form</option><option value="expressions/type-variable-axes.html">Font axes</option><option value="expressions/physics-fluid.html">Fluid</option><option value="expressions/type-variable.html">Variable font</option><option value="expressions/media-loop.html">Video</option></select></label><iframe id="mobile" src="index.html"></iframe><script type="module">
import {all} from './catalog.js';
import {experienceLabs} from './experience-labs.js';
const subset=new URLSearchParams(location.search).get('subset');
const selectedIds=new Set(experienceLabs.map(e=>e.id));
const entries=all.filter(e=>e.mount&&e.code?.includes('const lab=')&&e.level!=='basic'&&(!subset||selectedIds.has(e.id)));
document.querySelector('#width').onchange=e=>document.querySelector('#mobile').style.width=e.target.value+'px';document.querySelector('#page').onchange=e=>document.querySelector('#mobile').src=e.target.value;
let errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
for(const key of ['arc','ellipse','moveTo','lineTo','bezierCurveTo','quadraticCurveTo','fillRect','strokeRect','translate','rotate','scale','setTransform']){const original=CanvasRenderingContext2D.prototype[key];CanvasRenderingContext2D.prototype[key]=function(...args){if(args.some(x=>typeof x==='number'&&!Number.isFinite(x)))throw Error('Non-finite canvas coordinate: '+key);return original.apply(this,args)}}
const frame=()=>new Promise(r=>{const t=setTimeout(r,160);requestAnimationFrame(()=>requestAnimationFrame(()=>{clearTimeout(t);r()}))});
document.querySelector('#run').disabled=false;document.querySelector('#run').onclick=async()=>{const results=[],mount=document.querySelector('#mount');for(const e of entries){const start=errors.length;let api;try{mount.replaceChildren();const el=document.createElement('div');el.style.cssText='height:350px;width:390px';mount.append(el);const root=el.attachShadow({mode:'open'});root.innerHTML=`<style>${e.css}</style><div class="sample">${e.html}</div>`;api=e.mount(root);await Promise.resolve();for(const field of root.querySelectorAll('input[type=range]'))for(const value of [field.min,field.max]){field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));await Promise.resolve()}await frame();await frame();if(!['audio','video'].includes(e.engine)&&e.id!=='transition-native'){root.querySelector('[data-reset]')?.click();await frame();if(root.querySelector('dialog')?.open){root.querySelector('[data-close]').click();if(root.querySelector('dialog').open)throw Error('Dialog did not close')}}if(e.id==='ui-validation'||e.id==='case-form'){const input=root.querySelector('input[type=email]'),form=root.querySelector('form');input.value='bad';form.requestSubmit();if(input.getAttribute('aria-invalid')!=='true')throw Error('Invalid form not identified');input.value='hello@example.com';form.requestSubmit();if(input.getAttribute('aria-invalid')!=='false')throw Error('Valid form not accepted')}if(e.id==='ui-undo'){const item=root.querySelector('[data-item]');root.querySelector('[data-undo]').click();if(item.hidden)throw Error('Undo did not restore item')}if(e.id==='edit-sort'){root.querySelector('[data-next]').click();if(root.querySelector('.lab-status').textContent!=='WELL → MIX → PLAY → AGAIN')throw Error('Reorder failed')}
if(e.id==='edit-transfer'){root.querySelector('[data-transfer]').click();if(!root.querySelector('.lab-status').textContent.includes('準備 1 / 再生 2'))throw Error('Transfer failed')}
if(e.id==='search-suggest'){const input=root.querySelector('input[type=text]');input.value='MI';input.dispatchEvent(new Event('input'));input.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowDown',bubbles:true}));input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}));if(input.value!=='MIXWELL')throw Error('Autocomplete selection failed')}
if(e.id==='search-highlight'){const input=root.querySelector('input[type=text]');input.value='<img>';input.dispatchEvent(new Event('input'));if(root.querySelector('.search-results img'))throw Error('Unsafe text rendering')}
if(e.id==='search-chips'){root.querySelector('[data-tag]').click();if(root.querySelectorAll('.chip-list button').length!==1)throw Error('Chip missing');root.querySelector('[data-remove]').click();if(root.querySelectorAll('.chip-list button').length)throw Error('Chip removal failed')}
const canvas=root.querySelector('canvas');if(canvas&&e.engine==='canvas'){for(const key of [' ','ArrowRight',' '])canvas.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));await Promise.resolve()}if(errors.length>start)throw Error(errors.slice(start).join('; '));results.push({id:e.id,ok:true})}catch(err){results.push({id:e.id,ok:false,error:String(err)})}finally{api?.destroy?.()}document.querySelector('#status').textContent=`${results.length} / ${entries.length}`;document.querySelector('#results').textContent=JSON.stringify(results,null,2)}mount.replaceChildren();document.querySelector('#status').textContent=`Complete: ${results.filter(x=>x.ok).length} passed / ${results.filter(x=>!x.ok).length} failed`;};
</script></html>
