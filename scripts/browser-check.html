<!doctype html><html lang="ja"><meta charset="utf-8"><title>Internal catalogue verification</title><style>body{font:14px Arial}#mount{width:390px;height:350px}iframe{border:1px solid;width:390px;height:844px}pre{white-space:pre-wrap}</style><h1>Catalogue runtime checks</h1><button id="run" disabled>Run interactive lab checks</button><p id="status">Ready</p><div id="mount"></div><pre id="results"></pre><h2>Responsive viewport</h2><label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>Page<select id="page"><option value="index.html">Home</option><option value="catalog.html">Index</option><option value="expressions/physics-spring.html">Spring</option><option value="expressions/type-variable.html">Variable font</option><option value="expressions/media-loop.html">Video</option></select></label><iframe id="mobile" src="index.html"></iframe><script type="module">
import {all} from './catalog.js';
const entries=all.filter(e=>e.mount&&e.code?.includes('const lab='));
document.querySelector('#width').onchange=e=>document.querySelector('#mobile').style.width=e.target.value+'px';document.querySelector('#page').onchange=e=>document.querySelector('#mobile').src=e.target.value;
let errors=[];addEventListener('error',e=>errors.push(e.message));addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
for(const key of ['arc','ellipse','moveTo','lineTo','bezierCurveTo','quadraticCurveTo','fillRect','strokeRect','translate','rotate','scale','setTransform']){const original=CanvasRenderingContext2D.prototype[key];CanvasRenderingContext2D.prototype[key]=function(...args){if(args.some(x=>typeof x==='number'&&!Number.isFinite(x)))throw Error('Non-finite canvas coordinate: '+key);return original.apply(this,args)}}
const frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
document.querySelector('#run').disabled=false;document.querySelector('#run').onclick=async()=>{const results=[],mount=document.querySelector('#mount');for(const e of entries){const start=errors.length;let api;try{mount.replaceChildren();const el=document.createElement('div');el.style.cssText='height:350px;width:390px';mount.append(el);const root=el.attachShadow({mode:'open'});root.innerHTML=`<style>${e.css}</style><div class="sample">${e.html}</div>`;api=e.mount(root);await Promise.resolve();for(const field of root.querySelectorAll('input[type=range]'))for(const value of [field.min,field.max]){field.value=value;field.dispatchEvent(new Event('input',{bubbles:true}));await Promise.resolve()}const canvas=root.querySelector('canvas');if(canvas&&e.engine==='canvas'){for(const key of [' ','ArrowRight',' '])canvas.dispatchEvent(new KeyboardEvent('keydown',{key,bubbles:true}));await Promise.resolve()}if(errors.length>start)throw Error(errors.slice(start).join('; '));results.push({id:e.id,ok:true})}catch(err){results.push({id:e.id,ok:false,error:String(err)})}finally{api?.destroy?.()}document.querySelector('#status').textContent=`${results.length} / ${entries.length}`;document.querySelector('#results').textContent=JSON.stringify(results,null,2)}mount.replaceChildren();document.querySelector('#status').textContent=`Complete: ${results.filter(x=>x.ok).length} passed / ${results.filter(x=>!x.ok).length} failed`;};
</script></html>
