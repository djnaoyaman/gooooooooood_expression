<!doctype html><html lang="ja"><meta charset="utf-8"><title>Extension verification</title><style>body{font:14px Arial,Meiryo,sans-serif;background:#eee;padding:18px}button,select{padding:10px;margin:5px}iframe{display:block;width:320px;height:460px;border:1px solid #aaa;background:#fff}pre{white-space:pre-wrap;max-width:800px}#summary{font-weight:bold}</style><h1>38 extension specimens</h1><button id="run">Verify standalone HTML</button><select id="choose" aria-label="見本"></select><select id="width" aria-label="表示幅"><option>320</option><option>390</option><option>768</option></select><p id="summary">Ready</p><iframe title="Standalone specimen"></iframe><pre id="results"></pre><script type="module">
import {experienceLabs} from './experience-labs.js';import {craftLabs} from './craft-labs.js';import {spaceLabs} from './space-labs.js';
const all=[...experienceLabs,...craftLabs,...spaceLabs],frame=document.querySelector('iframe'),choose=document.querySelector('#choose'),summary=document.querySelector('#summary'),results=document.querySelector('#results');
for(const e of all){const o=document.createElement('option');o.value=e.id;o.textContent=e.ja;choose.append(o)}
function load(e,reduced=false){return new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('load timeout')),5000);frame.onload=()=>{clearTimeout(timer);resolve()};const hook=`<script>window.__qaErrors=[];addEventListener('error',e=>__qaErrors.push(e.message));addEventListener('unhandledrejection',e=>__qaErrors.push(String(e.reason)));${reduced?`const real=window.matchMedia;window.matchMedia=q=>{if(!q.includes('prefers-reduced-motion'))return real(q);const m=new EventTarget();m.matches=true;m.media=q;return m};`:''}<\/script>`;frame.srcdoc=e.code.replace('<script>',hook+'<script>')})}
const tick=()=>new Promise(r=>setTimeout(r,90));
choose.onchange=()=>load(all.find(e=>e.id===choose.value));document.querySelector('#width').onchange=e=>frame.style.width=e.target.value+'px';
document.querySelector('#run').onclick=async()=>{const rows=[];for(const e of all){try{choose.value=e.id;frame.style.width='320px';await load(e);await tick();const doc=frame.contentDocument,win=frame.contentWindow;if(doc.documentElement.scrollWidth>322)throw Error('Horizontal overflow');for(const input of doc.querySelectorAll('input[type=range]'))for(const value of [input.min,input.max]){input.value=value;input.dispatchEvent(new win.Event('input',{bubbles:true}))}await tick();if(win.__qaErrors.length)throw Error(win.__qaErrors.join('; '));doc.querySelector('[data-reset]')?.click();await tick();if(win.__qaErrors.length)throw Error(win.__qaErrors.join('; '));for(const button of doc.querySelectorAll('.lab-scene button')){const b=button.getBoundingClientRect(),scene=button.closest('.lab-scene').getBoundingClientRect();if(b.width&&b.height&&(b.bottom>scene.bottom+2||b.right>scene.right+2||b.left<scene.left-2))throw Error('Clipped scene control '+button.textContent)}
await load(e,true);await tick();if(frame.contentWindow.__qaErrors.length)throw Error('Reduced motion: '+frame.contentWindow.__qaErrors.join('; '));const play=frame.contentDocument.querySelector('[data-play]');if(e.code.includes('runCanvasLab')&&!play.hidden&&play.textContent!=='再生')throw Error('Reduced motion autoplay');rows.push({id:e.id,ok:true});}catch(err){rows.push({id:e.id,ok:false,error:String(err)})}summary.textContent=`${rows.length} / ${all.length}`;results.textContent=JSON.stringify(rows,null,2)}summary.textContent=`Complete: ${rows.filter(x=>x.ok).length} passed / ${rows.filter(x=>!x.ok).length} failed`;await load(all[0]);};await load(all[0]);
</script></html>
